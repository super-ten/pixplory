project_id = "pixplory"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://pixplory.com", "https://www.pixplory.com"]
enable_signup = false

[functions.register]
verify_jwt = false

[functions.username-login]
verify_jwt = false
